plugins {
    id 'java'
}

group = 'football'
version = '1.0'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17   // ให้ jar รันได้บน Java 17 ขึ้นไป
}

test {
    useJUnitPlatform()
}

jar {
    archiveFileName = 'FootballManager.jar'
    manifest {
        attributes 'Main-Class': 'football.Main'
    }
}